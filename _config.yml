    layout: list
    content:
      - layout: right
        title: Microsoft Corporation
        sub_title: Senior Software Engineer
        caption: September 2019 - January 2025
        link: microsoft.com
        quote: >
          Microsoft Corporation is an American multinational technology corporation that produces computer software, consumer electronics, personal computers, and related services.
        description: | # this will include new lines to allow paragraphs
          - Technical lead of a feature crew to implement and exposing a set of public APIs for data retrieval through Dataverse using Dynamics AX data entities and virtual entities which enabled Dynamics 365 customers to integrate with their preferred payroll system.
          - Designed and implemented a set of criteria the worker must meet to be considered ready to pay that is extensible for customers using a .NET MEF like class discovery system in X++ to provide Dynamics 365 Human Resources customers the ability to identify workers as ready to pay.
          - Adapted to learn new technologies and apply them to enabled Dynamics 365 Scheduling customer to integrate worker, skill and certificate data from Human Resources in Dynamics 365 Finance & Operations by implementing a new CRM package consisting of plugins, virtual entities, Dual Write maps and customizations that facilitates assigning a worker to a bookable resource and the worker's skills and certificates are merged into the resource's characteristics and synced in real time so the resource can be utilized in Project Operations or Field Service scheduling scenarios.
          - Onboarded and mentored team members to new processes as Dataverse engineers to contribute to the HR to Scheduling integration work mentioned above by creating a new Azure DevOps Git repository with the infrastructure for YAML build pipelines, MS Build artifacts and dependencies, new CRM solution for adding components, plugins and dual write maps and teaching the feature crew how to effectively and efficiently work in this new repository so we could deliver the feature.
          - Employed rapid prototyping to determine direction for design and implementation of HR To Scheduling integration to create a real time sync between Dataverse and Dynamics 365 Finance & Operations.
          - Brainstorming with feature crew to determine the best design for the feature.
          - Work item breakdown and estimate to provide accurate sprint planning and hit target delivery dates using Azure DevOps.
