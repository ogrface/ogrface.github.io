        quote: >
          Microsoft Corporation is an American multinational technology corporation that produces computer software, consumer electronics, personal computers, and related services.
        description: | # this will include new lines to allow paragraphs
          -	Contributed to an experimental Human Resources recruiting application on a newly released web-based implementation of the Dynamics AX platform called "Rainier" by designing and implementing an interview experience where users could rate candidates and implemented custom controls in HTML, JavaScript and X++.
          -	Contributed to an organization wide effort to migrate forms, classes, tables, and data entities from Dynamics AX 2012 desktop application to the new web-based platform specifically for the Cash Management module by updating obsolete coding patterns, applying well know form patterns, and providing functional parity.
          -	Contributed to the design and implementation of a standalone Human Resource SaaS offering based on the Dynamics AX platform that became Dynamics 365 Human Resources by reimagining and implementing the Goals and Reviews functionality that provided customizable experience of doing employee discussions of various types (e.g. year-end reviews, weekly one on ones) using X++ forms, classes and custom controls.
          -	Enabled engineers to improve the quality of the HR Standalone application by modifying the MS Build based build system to run Visual Studio test console and ADO YAML pipelines to run tests during pull requests submitted to the Git repository.
          -	Contributed to the design and implementation an integration with near real time sync and nightly recovery data merge between Dynamics 365 Human Resources and Dataverse by creating HR tables schema and solution in Dataverse, using the XRM SDK to write data directly to Dataverse and connecting to a Data Sync service to poll Dataverse for updates to records and write them back to Dynamics 365 HR.

